[project]
name = "market-maker-sim"
version = "0.1.0"
description = "A limit-order-book market-making simulator with an Avellaneda-Stoikov strategy and risk-adjusted backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_maker_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
